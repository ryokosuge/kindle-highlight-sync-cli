<h1>サインインまたはアカウントを作成</h1>
<form id="ap_login_form" name="signIn" method="post" action="/ax/claim/validate">
  <input type="hidden" name="appAction" value="SIGNIN_CLAIM_COLLECT">
  <input id="ap_email_login" name="email" type="text">
  <input id="auth-credential-autofill-hint" name="password" type="password" class="aok-hidden">
  <span id="continue">次に進む</span>
</form>
